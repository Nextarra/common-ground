# REVIEW TEMPLATE ONLY: no DNS, TLS certificates, key material or server configured.
# Replace reserved placeholders only after owner approval; verify TLS on actual host.
server {
    listen 443 ssl;
    server_name demo.example.invalid;
    ssl_certificate /run/secrets/approved-demo-certificate.pem;
    ssl_certificate_key /run/secrets/approved-demo-private-key.pem;
    client_max_body_size 16k;
    client_body_timeout 15s;
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_ignore_client_abort off;
    }
}
